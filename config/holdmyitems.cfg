# Configuration file

animations {
    # Choose your preferred animation speed (0.5-1.5) [range: 0.5 ~ 1.5, default: 1.0]
    S:animationSpeed=1.0

    # Enable or disable climb and crawl animation [default: true]
    B:enableClimbAndCrawlAnimation=true

    # Enable or disable punching animation [default: true]
    B:enablePunchingAnimation=true

    # Enable or disable swimming animation [default: true]
    B:enableSwimmingAnimation=true

    # Swing animation speed (6-12) [range: 6 ~ 12, default: 9]
    I:swingSpeed=9

    # Switch speed (0-10) [range: 0.0 ~ 10.0, default: 0.018]
    S:switchSpeed=0.018
}


misc {
    # Item IDs to exclude from rendering [default: ]
    S:itemIdsToExclude <
     >

    # Enable MB3D compatibility mode [default: false]
    B:mb3DCompat=false

    # Mod IDs to exclude from rendering [default: ]
    S:modIdsToExclude <
     >

    # Items that should render as a block instead [default: ]
    S:renderBlockAsItem <
     >

    # Render the first-person arm even while holding an item, instead of hiding it like vanilla does [default: true]
    B:showArmWithItem=true
}


positions {
    # Viewmodel X Offset [range: -10.0 ~ 10.0, default: 0.0]
    S:viewmodelXOffset=0.0

    # Viewmodel Y Offset [range: -10.0 ~ 10.0, default: 0.0]
    S:viewmodelYOffset=0.35

    # Viewmodel Z Offset [range: -10.0 ~ 10.0, default: 0.0]
    S:viewmodelZOffset=0.15
}


